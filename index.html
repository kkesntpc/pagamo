<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本機端無障礙刷題測驗系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 無障礙快速跳至主內容 -->
  <a href="#main-content" class="skip-link">跳至主要測驗內容</a>

  <div class="app-container">

    <!-- 頂部導航列 (含日夜模式切換) -->
    <header class="navbar" role="banner">
      <div class="brand-title">
        <span aria-hidden="true">🎯</span>
        <h1>題庫練習系統</h1>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="切換日間或夜間模式">
          <span id="theme-icon" aria-hidden="true">🌙</span>
          <span id="theme-label">夜間模式</span>
        </button>
      </div>
    </header>

    <!-- 主要操作區 -->
    <main id="main-content" role="main">

      <!-- 1. 測驗設定與首頁 (模式選擇、難度篩選、歷次成績) -->
      <section id="start-section" class="card" aria-label="測驗設定">
        <h2 style="font-size: 1.4rem; margin-bottom: 8px;">選擇練習模式</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          支援單題 10 秒配時之整體倒數（例如 50 題整體限時 8 分 20 秒）。答對自動跳下一題；答錯即時呈現詳解。
        </p>

        <!-- 模式切換 (20 / 25 / 40 / 50 題) -->
        <div class="mode-grid" role="group" aria-label="題數模式選擇">
          <button type="button" class="mode-btn" data-count="20" aria-pressed="false">
            <span class="mode-title">20 題</span>
            <span class="mode-desc">約 3 分 20 秒</span>
          </button>
          <button type="button" class="mode-btn" data-count="25" aria-pressed="false">
            <span class="mode-title">25 題</span>
            <span class="mode-desc">約 4 分 10 秒</span>
          </button>
          <button type="button" class="mode-btn" data-count="40" aria-pressed="false">
            <span class="mode-title">40 題</span>
            <span class="mode-desc">約 6 分 40 秒</span>
          </button>
          <button type="button" class="mode-btn active" data-count="50" aria-pressed="true">
            <span class="mode-title">50 題</span>
            <span class="mode-desc">約 8 分 20 秒</span>
          </button>
        </div>

        <!-- 題目難度篩選 (易 / 中 / 難 / 混合隨機) -->
        <div class="filter-group">
          <label for="diff-select">題目難度：</label>
          <select id="diff-select" class="filter-select">
            <option value="ALL">全部混合隨機（易 / 中 / 難）</option>
            <option value="易">基礎 - 簡單題</option>
            <option value="中">進階 - 中等題</option>
            <option value="難">挑戰 - 高難題</option>
          </select>
        </div>

        <!-- 開始按鈕 -->
        <button id="start-quiz-btn" class="btn-action-primary" type="button">
          <span>開始隨機測驗</span>
          <span aria-hidden="true">➔</span>
        </button>

        <!-- 歷次成績紀錄表格 -->
        <div class="history-section">
          <div class="history-header-row">
            <h3 style="font-size: 1.15rem;">📊 歷次練習成績紀錄</h3>
            <button id="clear-history-btn" class="btn-secondary" style="font-size: 0.85rem; padding: 4px 10px;" type="button">清除歷史</button>
          </div>

          <div class="table-wrapper">
            <table class="stats-table" aria-label="歷次測驗成績表">
              <thead>
                <tr>
                  <th scope="col">時間</th>
                  <th scope="col">模式</th>
                  <th scope="col">得分</th>
                  <th scope="col">答對率</th>
                  <th scope="col">總耗時</th>
                  <th scope="col">作答狀態</th>
                </tr>
              </thead>
              <tbody id="history-tbody">
                <!-- 動態注入成績資料 -->
              </tbody>
            </table>
          </div>
        </div>
      </section>


      <!-- 2. 測驗進行畫面 (支援整體倒數、題目與選項、答錯直接展開詳解) -->
      <section id="quiz-section" class="card hidden" aria-live="polite">
        <!-- 頂部資訊列：進度、難度、整體倒數 -->
        <div class="quiz-top-bar">
          <div class="quiz-meta-info">
            <span id="q-progress-text" style="font-weight: 700; font-size: 1.1rem;">載入中...</span>
            <span id="q-diff-badge" class="badge-tag badge-difficulty-易">易</span>
          </div>

          <!-- 整體總倒數計時器 -->
          <div id="timer-container" class="timer-container" aria-label="剩餘時間">
            <span aria-hidden="true">⏱️</span>
            <span id="exam-timer-display">08:20</span>
          </div>
        </div>

        <!-- 單元提示與題目標題 -->
        <span id="q-chapter-text" class="chapter-indicator"></span>
        <h2 id="question-title" class="question-title-text"></h2>

        <!-- 選項按鈕區 (支援鍵盤 1, 2, 3, 4 與 Tab 切換) -->
        <div id="options-list" class="options-list" role="group" aria-label="作答選項"></div>

        <!-- 答錯時直接在下方顯示詳解 -->
        <div id="explanation-panel" class="explanation-panel hidden" tabindex="-1">
          <h3>
            <span aria-hidden="true">📖</span>
            <span>答案解析</span>
          </h3>
          <p id="explanation-content" class="explanation-content"></p>
          <button id="next-btn" class="btn-action-primary btn-next-question" type="button">
            <span>下一題 (Enter)</span>
            <span aria-hidden="true">➔</span>
          </button>
        </div>
      </section>


      <!-- 3. 成績結算畫面 -->
      <section id="result-section" class="card hidden text-center" aria-label="測驗結算">
        <h2 style="font-size: 1.6rem; margin-bottom: 8px;">🎉 測驗完成！</h2>
        <p style="color: var(--text-muted);">本輪測驗詳細成果與作答數據如下：</p>

        <!-- 統計數據卡片 -->
        <div class="score-card-grid">
          <div class="score-stat-box">
            <span id="res-accuracy" class="stat-val">0%</span>
            <span class="stat-lbl">答對率</span>
          </div>
          <div class="score-stat-box">
            <span id="res-correct" class="stat-val">0</span>
            <span class="stat-lbl">答對題數</span>
          </div>
          <div class="score-stat-box">
            <span id="res-total" class="stat-val">0</span>
            <span class="stat-lbl">總題數</span>
          </div>
          <div class="score-stat-box">
            <span id="res-time" class="stat-val">00:00</span>
            <span class="stat-lbl">總作答時間</span>
          </div>
          <div class="score-stat-box">
            <span id="res-avg-time" class="stat-val">0 秒</span>
            <span class="stat-lbl">平均單題耗時</span>
          </div>
        </div>

        <!-- 結算操作按鈕 -->
        <div style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
          <button id="retry-exam-btn" class="btn-action-primary" style="flex: 1;" type="button">
            再練一次同模式
          </button>
          <button id="back-home-btn" class="btn-secondary" style="flex: 1;" type="button">
            返回模式選單
          </button>
        </div>
      </section>

    </main>

  </div>

  <!-- 引入題目資料庫與主控邏輯 (完全離線本機端運行) -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
